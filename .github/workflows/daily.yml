name: ETF premium daily

on:
  schedule:
    # UTC 01:45 / 06:30 / 08:30 = 北京时间 09:45 / 14:30 / 16:30
    - cron: "45 1 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "即使周末也尝试刷新行情"
        required: false
        type: boolean
        default: false
      send_notification:
        description: "本次手动运行完成后发送微信通知"
        required: false
        type: boolean
        default: false

concurrency:
  group: etf-premium-daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.metadata.outputs.status }}
      trade_date: ${{ steps.metadata.outputs.trade_date }}
      should_deploy: ${{ steps.metadata.outputs.should_deploy }}
      should_notify: ${{ steps.metadata.outputs.should_notify }}
      snapshot_changed: ${{ steps.metadata.outputs.snapshot_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chinese font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run offline tests
        run: pytest

      - name: Run static checks
        run: ruff check .

      - name: Generate report
        run: >-
          python -m etf_premium run
          ${{ inputs.force_refresh == true && '--force-refresh' || '' }}

      - name: Read run metadata
        id: metadata
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("site/run_result.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key in ("status", "trade_date", "should_deploy", "should_notify", "snapshot_changed"):
                  value = result.get(key, "")
                  if isinstance(value, bool):
                      value = str(value).lower()
                  print(f"{key}={value}", file=output)

      - name: Commit fresh snapshot
        if: steps.metadata.outputs.snapshot_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "data: snapshot ${{ steps.metadata.outputs.trade_date }}"
          git push

      - name: Configure Pages
        if: steps.metadata.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.metadata.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload notification artifact
        if: steps.metadata.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-site
          path: site
          retention-days: 3

  deploy-pages:
    if: needs.build.outputs.should_deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: >-
      needs.build.outputs.should_notify == 'true' &&
      needs.deploy-pages.result == 'success' &&
      (github.event_name == 'schedule' || inputs.send_notification == true)
    needs: [build, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: generated-site
          path: site
      - name: Send ServerChan notification
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PAGE_URL: https://kevinzhouq.github.io/etf-premium-daily/
        run: |
          test -n "$SERVERCHAN_SENDKEY"
          python -m etf_premium notify

  notify-failure:
    if: >-
      always() &&
      (needs.build.result == 'failure' || needs.deploy-pages.result == 'failure') &&
      (github.event_name == 'schedule' || inputs.send_notification == true)
    needs: [build, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Send text-only failure notification
        if: env.SERVERCHAN_SENDKEY != ''
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import os
          import re
          import requests

          key = os.environ["SERVERCHAN_SENDKEY"]
          match = re.match(r"^sctp(\d+)t", key)
          endpoint = (f"https://{match.group(1)}.push.ft07.com/send/{key}.send" if match
                      else f"https://sctapi.ftqq.com/{key}.send")
          try:
              response = requests.post(endpoint, data={
                  "title": "ETF每日溢价率任务失败",
                  "desp": f"本次任务未能生成可发布的完整榜单。\n\n[查看运行日志]({os.environ['RUN_URL']})",
              }, timeout=20)
              response.raise_for_status()
          except requests.RequestException:
              raise SystemExit("Server酱故障通知发送失败") from None
